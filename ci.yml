name: Website CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML files
        run: |
          test -f index.html
          test -f about.html
          test -f contact.html
          test -f portfolio.html
          test -f services.html

      - name: Check CSS and JavaScript
        run: |
          test -d css
          test -d js
          test -f css/style.css
          test -f js/main.js

      - name: CI completed
        run: echo "Website validation completed successfully"